<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rooftop Runner</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Rooftop Runner">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050608">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --page: #050608;
  --ink: #f2f2ee;
  --btn-bg: #24303a;
  --btn-fg: #ffd45a;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #050608; } }
:root[data-theme="dark"] { --page: #050608; }
:root[data-theme="light"] { --page: #0b0d10; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; overflow: hidden; }
body {
  height: 100%; background: var(--page); color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  font-family: "Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
}
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.hud-btn {
  position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  width: 40px; height: 40px; padding: 0; cursor: pointer; opacity: .85; z-index: 8;
  font: 12px "Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
  color: #fff6e0; background: rgba(18,24,30,.86); border: 3px solid #e9e2cc;
  box-shadow: inset 0 3px 0 #8f2b22; image-rendering: pixelated;
}
#mute { right: calc(10px + env(safe-area-inset-right, 0px)); }
#home { right: calc(58px + env(safe-area-inset-right, 0px)); }
#home svg { width: 18px; height: 18px; display: block; margin: auto; }
#mute svg { width: 18px; height: 18px; display: block; margin: auto; }
#mute .slash { display: none; }
#mute.off { color: #8a8478; }
#mute.off .slash { display: inline; fill: #e0563f; }
#confirm { position: fixed; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; background: rgba(4,8,12,.6); }
#confirm[hidden] { display: none; }
#confirm .box { background: rgba(18,24,30,.94); border: 4px solid #e9e2cc; box-shadow: inset 0 4px 0 #8f2b22; padding: 20px 22px; text-align: center; color: #fff6e0; max-width: 86vw; }
#confirm p { margin: 0 0 18px; font-size: 12px; line-height: 1.7; }
#confirm .row { display: flex; gap: 14px; justify-content: center; }
#confirm button { font: 12px "Press Start 2P", ui-monospace, Menlo, Consolas, monospace; padding: 10px 16px; cursor: pointer; color: #fff6e0; background: rgba(18,24,30,.9); border: 3px solid #e9e2cc; }
#confirm button.sel { background: #e0563f; color: #fff; border-color: #ffd45a; }
.hud-btn:focus-visible, #fs:focus-visible, .menu button:focus-visible { outline: 3px solid var(--btn-fg); outline-offset: 2px; }

/* ---------- title screen ---------- */
#title { position: fixed; inset: 0; z-index: 6; overflow: hidden; background: #050608; }
#title .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
#title .artbox { position: absolute; }
#title p { position: absolute; margin: 0; text-align: center; text-shadow: calc(var(--u) * 2) calc(var(--u) * 2) 0 #14100c; }
#title .presents { left: calc(var(--u) * 70); width: calc(var(--u) * 430); top: calc(var(--u) * 14); font-size: calc(var(--u) * 10); letter-spacing: calc(var(--u) * 2); color: #b9c0c8; }
#title .logo { position: absolute; left: calc(var(--u) * 70); top: calc(var(--u) * 32); width: calc(var(--u) * 430); height: calc(var(--u) * 214); display: block; }
#title .foot { left: calc(var(--u) * 70); width: calc(var(--u) * 430); bottom: calc(var(--u) * 12); font-size: calc(var(--u) * 9); letter-spacing: calc(var(--u) * 1); color: #f2f2ee; }
#title .start { left: calc(var(--u) * 150); top: calc(var(--u) * 266); text-align: left; font-size: calc(var(--u) * 14); letter-spacing: calc(var(--u) * 1); color: #ffd45a; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #title .start { animation: none; } }
.menu { position: absolute; left: calc(var(--u) * 150); top: calc(var(--u) * 252); display: flex; flex-direction: column; align-items: flex-start; }
.menu button {
  height: calc(var(--u) * 44); padding: 0 calc(var(--u) * 8) 0 0; border: 0; background: transparent; cursor: pointer;
  color: #f2f2ee; font-family: inherit; font-size: calc(var(--u) * 14); letter-spacing: calc(var(--u) * 1);
  display: flex; align-items: center; gap: calc(var(--u) * 12); text-shadow: calc(var(--u) * 2) calc(var(--u) * 2) 0 #14100c;
}
.menu .hammer { width: calc(var(--u) * 24); height: calc(var(--u) * 24); visibility: hidden; flex: none; }
.menu button.sel { color: #ffffff; }
.menu button.sel .hammer { visibility: visible; }
.menu button:not(.sel) { color: #c9ccc8; }

#rotate {
  position: fixed; inset: 0; z-index: 10; background: var(--page);
  padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center;
}
#rotate p { margin: 0; font-size: 12px; line-height: 2; max-width: 22ch; }
.phone { width: 44px; height: 76px; border: 5px solid var(--ink); border-radius: 8px; position: relative; animation: turn 2.4s ease-in-out infinite; }
.phone::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 8px; height: 4px; margin-left: -4px; background: var(--ink); }
@keyframes turn { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
@media (prefers-reduced-motion: reduce) { .phone { animation: none; transform: rotate(-90deg); } }
/* ---------- player accounts ---------- */
#who { top: calc(10px + env(safe-area-inset-top, 0px)); bottom: auto; right: calc(10px + env(safe-area-inset-right, 0px)); width: auto; height: 36px; max-width: 46vw; padding: 0 12px; font-size: 10px; color: #ffd45a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#acct { position: fixed; inset: 0; z-index: 12; display: flex; padding: 8px; overflow: auto; touch-action: pan-y; background: rgba(4,8,12,.74); }
#acct[hidden] { display: none; }
#acct .box { margin: auto; width: min(380px, 94vw); background: rgba(18,24,30,.96); border: 4px solid #e9e2cc; box-shadow: inset 0 4px 0 #8f2b22; padding: 16px 18px; text-align: center; color: #fff6e0; }
#acct p { margin: 0 0 12px; font-size: 12px; line-height: 1.7; }
#acct label { display: block; text-align: left; font-size: 9px; color: #b9c0c8; margin-bottom: 10px; }
#acct input { display: block; width: 100%; margin-top: 6px; padding: 8px; border-radius: 0; font: 16px "Press Start 2P", ui-monospace, Menlo, Consolas, monospace; color: #fff6e0; background: #0b1015; border: 3px solid #e9e2cc; user-select: text; -webkit-user-select: text; touch-action: manipulation; }
#acct input:focus { outline: none; border-color: #ffd45a; }
#acct #acctMsg { min-height: 1.7em; margin: 0 0 8px; font-size: 9px; color: #ffb08a; }
#acct #acctMsg.ok { color: #b9c0c8; }
#acct .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
#acct button { font: 11px "Press Start 2P", ui-monospace, Menlo, Consolas, monospace; padding: 10px 12px; cursor: pointer; color: #fff6e0; background: rgba(18,24,30,.9); border: 3px solid #e9e2cc; }
#acct button.sel { background: #e0563f; color: #fff; border-color: #ffd45a; }
#acct button:disabled { opacity: .5; }
#acct button.link { margin-top: 14px; padding: 6px; border: 0; background: transparent; color: #b9c0c8; font-size: 9px; text-decoration: underline; }
#acct button:focus-visible { outline: 3px solid var(--btn-fg); outline-offset: 2px; }
#fs { font: 10px "Press Start 2P", ui-monospace, Menlo, Consolas, monospace; padding: 12px 14px; cursor: pointer; color: var(--btn-fg); background: var(--btn-bg); border: 3px solid #0e161c; }
</style>
</head>

function hex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function shade(h, f) { const c = rgb(h); return hex(...c.map(v => f < 0 ? v * (1 + f) : v + (255 - v) * f)); }

function nightify(src, col) { const c = mkC(src.width, src.height), g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); return c; }

// ---------- character sprites (16 x 28) ----------
const PAL = { K:'#1c130e', H:'#3e2718', h:'#5e3d26', S:'#ebb690', s:'#c78c66', E:'#4f7fb3', W:'#ffffff',
  B:'#6b3e24', b:'#4e2c18', T:'#222228', R:'#3d3d48', t:'#141418', G:'#4a3424', J:'#3f64a6', j:'#2c4a80', O:'#8a5a32' };
const HEAD = ['..KKKKKKK..','.KHHHhhhHK.','KHHHHHHHhHK','KHHHSSSSSK.','KHHSSSHHSK.','KHsSSSESSSK','KHsSSSSSSSK','.KBSSSSSSK.','.KBBBBWWBK.','..KBBBBBBK.','...KbbbbK..','....KssK...'];
const TORSO = ['..KKTTTTTTTTKK..','.KTTTTRRTTTTTTK.','.KTTTTRTTTTTTTK.','.KSKTTTTTTTTKSK.','KSsKTTTTTTTTKsSK','KSSKTTTTTTTTKSSK','.KSKtTTTTTTtKSK.','.KSKGGGGGGGGKSK.'];

  return c;
}
// arm overlays for the jump and climb frames: rows of [x, pattern] pixels drawn over the base sprite
function armPatch(c, clearX, edgeX, rows) {
  const g = c.getContext('2d');

const TRUCK_DOOR = 44;  // driver door, from the truck's back bumper
function drawTruck(t) {
  const x = Math.round(t.x), bounce = t.vx > 20 ? ((clock * 14 | 0) % 2) : 0;
  if (TRUCK_IMG.complete && TRUCK_IMG.naturalWidth) {
    ctx.drawImage(TRUCK_IMG, x, -65 - bounce);
    if (t.door) { ctx.fillStyle = '#050506'; ctx.fillRect(x + 45, -57 - bounce, 18, 33); ctx.fillStyle = '#2a1c14'; ctx.fillRect(x + 49, -40 - bounce, 10, 10); }
    if (t.lights) {
      const hy = -35 - bounce, fx = x + 125;
      for (let i = 0; i < 160; i++) { const hh = 3 + Math.floor(i * .3), cy = hy + Math.round(i * .1); ctx.fillStyle = `rgba(255,240,190,${(.24 * (1 - i / 160)).toFixed(3)})`; ctx.fillRect(fx + i, cy - Math.floor(hh / 2), 1, hh); }
      ctx.fillStyle = 'rgba(255,235,170,0.14)'; ctx.fillRect(fx + 12, -3, 130, 3);
      for (const lx of [x + 89, x + 123]) { ctx.fillStyle = 'rgba(255,245,210,0.3)'; disc(ctx, lx, hy, 5); ctx.fillStyle = '#fffbe8'; ctx.fillRect(lx - 2, hy - 3, 4, 6); }
      ctx.fillStyle = 'rgba(255,40,30,0.35)'; disc(ctx, x + 2, -36 - bounce, 4); ctx.fillStyle = '#ff4a3a'; ctx.fillRect(x + 1, -41 - bounce, 2, 10);
    }
    return;
  }
  ctx.drawImage(TRUCK, x, -58 - bounce);
  if (t.door) { ctx.fillStyle = '#050506'; ctx.fillRect(x + 65, -55 - bounce, 19, 33); ctx.fillStyle = '#2a1c14'; ctx.fillRect(x + 70, -36 - bounce, 10, 10); }
  drawWheel(x + 25, -12, t.ang); drawWheel(x + 98, -12, t.ang);
}

let LIGHTS = [];
function metalFace(g, x0, y0, w, h, base, style) {
  const L = shade(base, .25), LL = shade(base, .45), D = shade(base, -.28), DD = shade(base, -.5), d = shade(base, -.1);
  g.fillStyle = base; g.fillRect(x0, y0, w, h);
  for (let i = 0; i < w; i++) {
    let col = null, m;
    if (style === 'ribbed') { m = i % 12; col = m === 0 ? L : m === 1 ? LL : m === 2 ? L : m === 3 ? DD : m === 7 ? L : m === 8 ? D : null; }
    else if (style === 'seam') { m = i % 14; col = m === 0 ? LL : m === 1 ? DD : m === 7 ? d : null; }
    else if (style === 'seam3d') { m = i % 16; col = m === 0 ? L : (m === 1 || m === 2) ? LL : m === 3 ? D : m === 4 ? DD : (m === 9 || m === 12) ? d : null; }
    else { m = i % 4; col = m === 0 ? L : m === 2 ? D : null; }

  e.stopPropagation();
  try { const el = document.documentElement; if (el.requestFullscreen) await el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } catch (err) {}
  try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (err) {}
  setTimeout(resize, 300);
});

// ---------- input ----------
function press() {
  initAudio();
  if (portrait || state === 'title' || state === 'select') return;
  if (state === 'credits') { if (credDone() || credT > 1.5) goTitle(); return; }
  if (state === 'dead') { if (deathT > 1.5) startRun(mode, levelIdx); return; }
  if (state === 'finish') {
    if (fin.phase === 'drive' && fin.t > 2.6) { if (levelIdx + 1 < LEVELS.length) startRun('levels', levelIdx + 1); else startCredits(); }
    return;
  }
  if (countT > 0) { if (waitT > .45) { countT = 0; goT = .7; held = false; sfx('up'); } return; }
  if (player.state === 'climb') climbTap();
  else if (player.state === 'run') { held = true; player.buffer = .13; }
}
function release() {
  held = false;
  const p = player;
  if (p && state === 'play' && p.state === 'run' && !p.grounded && p.vy < 0) {
    if ((p.jt || 0) < .12) { const need = Math.max(0, HOP - (p.jy - p.y)); p.vy = Math.max(p.vy, -Math.sqrt(2 * GRAV * need)); }
    else if (p.vy < JUMP_CUT) p.vy = JUMP_CUT;
  }
}
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
window.addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) release(); });
window.addEventListener('pointerdown', e => {
  if (paused || (e.target.closest && (e.target.closest('button') || e.target.closest('#rotate') || e.target.closest('#confirm') || e.target.closest('#title') || e.target.closest('#acct')))) return;
  e.preventDefault();
  if (state === 'select') { const r = cvs.getBoundingClientRect(); selectAt((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H); return; }
  press();
}, { passive: false });
window.addEventListener('keydown', e => {
  if (!acctEl.hidden) return;
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (state === 'title') {
    if (!titleReady) { if (['Space', 'Enter', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyS'].includes(e.code)) { e.preventDefault(); titleStart(); } return; }
    if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); setSel((sel + 1) % 2); sfx('move'); }
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); setSel((sel + 1) % 2); sfx('move'); }
    else if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat) { e.preventDefault(); choose(sel); }
    return;
  }
  if (state === 'select') {
    e.preventDefault();
    if (e.code === 'ArrowUp' || e.code === 'KeyW') moveSel(0, -1);
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') moveSel(0, 1);
    else if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveSel(-1, 0);
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') moveSel(1, 0);
    else if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat) pickSel(selIdx);
    else if (e.code === 'Escape') goTitle();
    return;
  }
  if (paused) {
    e.preventDefault();
    if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD', 'ArrowUp', 'ArrowDown'].includes(e.code)) setCSel(1 - cSel);
    else if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat) closeAsk(cSel === 0);
    else if (e.code === 'Escape') closeAsk(false);
    return;
  }
  if (e.code === 'Escape') { askHome(); return; }
  if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) { e.preventDefault(); if (e.repeat) return; press(); }
});
muteBtn.addEventListener('click', e => { e.stopPropagation(); initAudio(); toggleMute(); });
const confirmEl = document.getElementById('confirm'), cYes = document.getElementById('cYes'), cNo = document.getElementById('cNo');
let paused = false, cSel = 1;
function setCSel(i) { cSel = i; cYes.classList.toggle('sel', i === 0); cNo.classList.toggle('sel', i === 1); }
function askHome() {
  if (paused || state === 'title') return;
  paused = true; held = false; setCSel(1); confirmEl.hidden = false; stopWhistle();
  if (A.ctx) A.ctx.suspend(); cNo.focus();
}
function closeAsk(goHome) {
  confirmEl.hidden = true; paused = false; last = performance.now();
  if (goHome) { if (A.ctx && !portrait) A.ctx.resume(); goTitle(); }
  else if (A.ctx && !portrait) A.ctx.resume();
}
cYes.addEventListener('click', e => { e.stopPropagation(); closeAsk(true); });
cNo.addEventListener('click', e => { e.stopPropagation(); closeAsk(false); });
confirmEl.addEventListener('pointerdown', e => { e.stopPropagation(); if (e.target === confirmEl) closeAsk(false); });
homeBtn.addEventListener('click', e => { e.stopPropagation(); askHome(); });
document.addEventListener('touchmove', e => { if (!(e.target.closest && e.target.closest('#acct'))) e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', () => { if (!A.ctx) return; if (document.hidden) A.ctx.suspend(); else if (!portrait) A.ctx.resume(); });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// ---------- go ----------
reset();
resize();
if (document.fonts && document.fonts.load) document.fonts.load(`16px ${FONT}`).catch(() => {});
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (!paused) update(dt); if (state !== 'title') draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
